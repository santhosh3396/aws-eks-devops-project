apiVersion: v1
kind: Service

metadata:
  name: flask-service
  namespace: default
  labels:
    app: flask-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

spec:
  selector:
    app: flask-app

  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
    name: http

  type: LoadBalancer
