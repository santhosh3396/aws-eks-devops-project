apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-app
  namespace: default
  labels:
    app: flask-app
    version: "1.0"

spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: flask-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
      - name: flask-app
        image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/flask-app:latest

        ports:
        - containerPort: 5000

        env:
        - name: ENVIRONMENT
          value: "production"

        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
